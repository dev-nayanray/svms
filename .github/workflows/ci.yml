name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time placeholders — real values live in Vercel.
      # `next build` never opens a DB connection (all data pages are
      # force-dynamic), but Prisma/NextAuth config must parse.
      DATABASE_URL: mongodb://ci-placeholder:27017/euroscope
      AUTH_SECRET: ci-placeholder-secret-ci-placeholder-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
