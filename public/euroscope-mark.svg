<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium gold gradient — brighter, more vibrant -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="30%" stop-color="#EAB308"/>
      <stop offset="65%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
    <!-- Secondary gradient for depth on leaves -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <!-- Drop shadow filter for the monogram -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#854D0E" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ── Left laurel branch — cleaner, more symmetrical ── -->
  <g fill="url(#goldLight)">
    <!-- Main stem -->
    <path d="M155 395 Q110 310 125 225 Q140 165 185 130" stroke="url(#gold)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- Outer leaves (7, pointing outward-left) -->
    <path d="M120 360 Q100 355 88 345 Q95 365 115 368 Z"/>
    <path d="M108 325 Q86 322 74 310 Q82 332 103 335 Z"/>
    <path d="M100 288 Q78 285 66 272 Q74 295 95 298 Z"/>
    <path d="M98 250 Q76 248 66 235 Q74 258 93 260 Z"/>
    <path d="M105 215 Q84 212 76 198 Q84 220 100 224 Z"/>
    <path d="M120 182 Q102 178 96 164 Q104 185 116 190 Z"/>
    <path d="M145 155 Q130 148 128 134 Q136 152 142 158 Z"/>
    <!-- Inner leaves (7, pointing inward-right) -->
    <path d="M148 358 Q165 358 178 348 Q170 368 152 368 Z"/>
    <path d="M140 320 Q158 318 170 308 Q162 330 144 332 Z"/>
    <path d="M137 283 Q155 280 167 270 Q159 293 140 295 Z"/>
    <path d="M138 245 Q156 242 168 232 Q160 255 141 257 Z"/>
    <path d="M145 210 Q162 207 172 196 Q164 220 147 223 Z"/>
    <path d="M160 178 Q175 174 182 162 Q176 185 163 190 Z"/>
    <path d="M180 150 Q193 144 196 132 Q192 153 184 160 Z"/>
  </g>

  <!-- ── Right laurel branch (mirror of left) ── -->
  <g fill="url(#goldLight)">
    <path d="M357 395 Q402 310 387 225 Q372 165 327 130" stroke="url(#gold)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M392 360 Q412 355 424 345 Q417 365 397 368 Z"/>
    <path d="M404 325 Q426 322 438 310 Q430 332 409 335 Z"/>
    <path d="M412 288 Q434 285 446 272 Q438 295 417 298 Z"/>
    <path d="M414 250 Q436 248 446 235 Q438 258 419 260 Z"/>
    <path d="M407 215 Q428 212 436 198 Q428 220 412 224 Z"/>
    <path d="M392 182 Q410 178 416 164 Q408 185 396 190 Z"/>
    <path d="M367 155 Q382 148 384 134 Q376 152 370 158 Z"/>
    <path d="M364 358 Q347 358 334 348 Q342 368 360 368 Z"/>
    <path d="M372 320 Q354 318 342 308 Q350 330 368 332 Z"/>
    <path d="M375 283 Q357 280 345 270 Q353 293 372 295 Z"/>
    <path d="M374 245 Q356 242 344 232 Q352 255 371 257 Z"/>
    <path d="M367 210 Q350 207 340 196 Q348 220 365 223 Z"/>
    <path d="M352 178 Q337 174 330 162 Q336 185 349 190 Z"/>
    <path d="M332 150 Q319 144 316 132 Q320 153 328 160 Z"/>
  </g>

  <!-- ── Central "E" monogram — with shadow filter for depth ── -->
  <text x="256" y="285" font-family="Georgia, 'Times New Roman', serif" font-size="170" font-weight="bold" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#shadow)">E</text>

  <!-- ── Decorative ribbon bow at bottom — more refined ── -->
  <g fill="url(#gold)">
    <!-- Center knot -->
    <path d="M256 398 Q238 388 226 398 Q238 412 256 402 Q274 412 286 398 Q274 388 256 398Z"/>
    <!-- Left ribbon tail with curve -->
    <path d="M226 398 Q198 408 180 430 Q195 422 212 416 Q220 410 228 405Z" opacity="0.9"/>
    <!-- Right ribbon tail with curve -->
    <path d="M286 398 Q314 408 332 430 Q317 422 300 416 Q292 410 284 405Z" opacity="0.9"/>
  </g>

  <!-- ── Small decorative star at top center ── -->
  <path d="M256 115 L258 122 L265 122 L259 127 L261 134 L256 130 L251 134 L253 127 L247 122 L254 122 Z" fill="url(#gold)" opacity="0.8"/>
</svg>
